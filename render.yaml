# Render Blueprint — SecureBank (no-SDK) as THREE services, per Amit:
#   1. litellm-gateway            = LiteLLM + Reva plugin + sub-agent MCP  (the gateway)
#   2. securebank-langraph-litellm = the LangGraph / FinBot orchestrator backend
#   3. securebank-app-v2-litellm   = the SecureBank dashboard frontend (static)
#
# Dependencies: frontend -> langgraph -> gateway.
# After deploy: set LITELLM_BASE_URL on the langgraph service to the gateway's URL.
#
# NOTE ON MEMORY: the gateway (LiteLLM + langchain sub-agent MCP) needs > 512Mi
# under real model load. On the free tier it will OOM/crash when a prompt runs.
# Upgrade JUST `litellm-gateway` to the Standard (2GB) instance for a reliable
# demo; the other two fit the free tier fine.
services:
  # ── 1. the gateway ──
  - type: web
    name: litellm-gateway
    runtime: python
    plan: free          # ⚠️ upgrade to `standard` in the dashboard to avoid OOM
    buildCommand: pip install -r requirements.local.txt
    startCommand: ./start-litellm.sh
    healthCheckPath: /health/liveliness
    envVars:
      - key: AZURE_API_KEY
        sync: false
      - key: REVA_AUTH_TOKEN
        sync: false
      - key: AZURE_CLIENT_SECRET
        sync: false
      - key: REVA_FOUNDRY_API_KEY
        sync: false
      - key: REVA_PDP_URL
        value: https://api.pr06.preview.reva.ai/pdp/access/v1/ai/evaluation
      - key: REVA_POLICYSTORE_ID
        value: 9a8c5759-b1ca-4c98-9346-2426338df333
      - key: REVA_PDP_ORIGIN
        value: https://demo.preview.reva.ai
      - key: REVA_SCHEMA_MODE
        value: agent_v5
      - key: REVA_HOOK_MODE
        value: enforce
      - key: LITELLM_MASTER_KEY
        value: sk-foundry-test
      - key: LITELLM_MODEL
        value: gpt-5-mini
      - key: REVA_USER
        value: employee@securebank
      - key: MCP_SERVER_URL
        value: https://reva-mcp-server-v2.onrender.com
      - key: SECUREBANK_URL
        value: https://securebank-app-v2.onrender.com

  # ── 2. the LangGraph / FinBot backend ──
  - type: web
    name: securebank-langraph-litellm
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.local.txt
    startCommand: ./start-app.sh
    healthCheckPath: /health
    envVars:
      # ⚠️ Set AFTER the gateway is live: https://<litellm-gateway-url>/v1
      - key: LITELLM_BASE_URL
        sync: false
      - key: LITELLM_MODEL
        value: gpt-5-mini
      - key: LITELLM_MASTER_KEY
        value: sk-foundry-test
      - key: REVA_USER
        value: employee@securebank
      - key: USER_ENTRY_AUTH
        value: "true"
      - key: MCP_SERVER_URL
        value: https://reva-mcp-server-v2.onrender.com
      - key: SECUREBANK_URL
        value: https://securebank-app-v2.onrender.com

  # ── 3. the SecureBank dashboard frontend (static) ──
  - type: web
    name: securebank-app-v2-litellm
    runtime: static
    staticPublishPath: ./ui
