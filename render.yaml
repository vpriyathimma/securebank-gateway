# Render Blueprint — SecureBank gateway (no-SDK) as TWO free web services.
#
#   Service A  securebank-litellm  = LiteLLM gateway + Reva plugin + sub-agent MCP
#                                     (LiteLLM public on $PORT; MCP internal :8090)
#   Service B  securebank-app       = FinBot (public on $PORT) -> talks to Service A
#
# Only dependency is B -> A. After Service A is live, set LITELLM_BASE_URL on
# Service B to  https://<service-A-url>/v1  (see DEPLOY-RENDER.md).
services:
  # ── Service A : the gateway (LiteLLM + Reva + sub-agent MCP) ──
  - type: web
    name: securebank-litellm
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.local.txt
    startCommand: ./start-litellm.sh
    healthCheckPath: /health/liveliness
    envVars:
      # secrets (set in dashboard)
      - key: AZURE_API_KEY
        sync: false
      - key: REVA_AUTH_TOKEN          # Reva PDP token (expires — refresh before demo)
        sync: false
      - key: AZURE_CLIENT_SECRET      # SharePoint agent (runs here, in the MCP)
        sync: false
      - key: REVA_FOUNDRY_API_KEY     # SharePoint agent's Foundry key
        sync: false
      # Reva authorization
      - key: REVA_PDP_URL
        value: https://api.pr06.preview.reva.ai/pdp/access/v1/ai/evaluation
      - key: REVA_POLICYSTORE_ID
        value: 9a8c5759-b1ca-4c98-9346-2426338df333
      - key: REVA_PDP_ORIGIN
        value: https://demo.preview.reva.ai
      - key: REVA_SCHEMA_MODE
        value: agent_v5
      - key: REVA_HOOK_MODE
        value: enforce
      - key: LITELLM_MASTER_KEY
        value: sk-foundry-test
      # sub-agent MCP config (credit/sharepoint run here)
      - key: LITELLM_MODEL
        value: gpt-5-mini
      - key: REVA_USER
        value: employee@securebank
      - key: MCP_SERVER_URL
        value: https://reva-mcp-server-v2.onrender.com
      - key: SECUREBANK_URL
        value: https://securebank-app-v2.onrender.com

  # ── Service B : the FinBot app ──
  - type: web
    name: securebank-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.local.txt
    startCommand: ./start-app.sh
    healthCheckPath: /health
    envVars:
      # ⚠️ Set this AFTER Service A is live: https://<service-A-url>/v1
      - key: LITELLM_BASE_URL
        sync: false
      - key: LITELLM_MODEL
        value: gpt-5-mini
      - key: LITELLM_MASTER_KEY
        value: sk-foundry-test
      - key: REVA_USER
        value: employee@securebank
      - key: USER_ENTRY_AUTH
        value: "true"
      - key: MCP_SERVER_URL
        value: https://reva-mcp-server-v2.onrender.com
      - key: SECUREBANK_URL
        value: https://securebank-app-v2.onrender.com
